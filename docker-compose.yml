# WARNING: This compose file is for LOCAL DEVELOPMENT ONLY.
# The default credentials (legacylock/legacylock, admin/admin) are INSECURE.
# For production/staging, ALWAYS override with strong secrets via .env or environment variables.
# NEVER deploy this file as-is to any non-local environment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacylock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacylock}
      POSTGRES_DB: ${POSTGRES_DB:-legacylock_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacylock}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: ["legacylock"]

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legacylock}:${POSTGRES_PASSWORD:-legacylock}@postgres:5432/${POSTGRES_DB:-legacylock_dev}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (>=32 chars)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      HEARTBEAT_ENABLED: ${HEARTBEAT_ENABLED:-true}
      HEARTBEAT_CHECK_INTERVAL: ${HEARTBEAT_CHECK_INTERVAL:-3600}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-keys/jwt_private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-keys/jwt_public.pem}
    volumes:
      # JWT signing keys live outside the image (gitignored). Generate with:
      # openssl genrsa -out backend/keys/jwt_private.pem 2048 && openssl rsa -in backend/keys/jwt_private.pem -pubout -out backend/keys/jwt_public.pem
      - ./backend/keys:/app/keys:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: ["legacylock"]

  pgadmin:
    profiles: ["dev"]
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@legacylock.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: ["legacylock"]

volumes:
  postgres_data:

networks:
  legacylock: