# Render Free API for the selected Vercel -> Render -> Neon architecture.
# Neon is external; the Vercel frontend is configured separately.
# Free has no worker or pre-deploy migration command. Run Alembic from a
# trusted local/CI environment before manually deploying schema changes.
services:
  - type: web
    name: legacylock-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: TASK_MODE
        value: single_process_demo
      - key: BACKGROUND_IN_API
        value: "false"
      - key: DEMO_CHECK_INTERVAL_SECONDS
        value: "1800"
      - key: DEMO_DELIVERY_BATCH_SIZE
        value: "5"
      - key: DEMO_ARGON2_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: DB_POOL_TIMEOUT
        value: "10"
      - key: DATABASE_URL
        # Use Neon direct/unpooled URL with sslmode=verify-full.
        sync: false
      - key: PGSSLROOTCERT
        value: /etc/ssl/certs/ca-certificates.crt
      - key: SESSION_SECRET
        sync: false
      - key: AUTH_EPOCH
        sync: false
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: ALLOWED_ORIGINS
        # Exact HTTPS origin of the Vercel frontend.
        sync: false
      - key: FRONTEND_URL
        # Same exact HTTPS origin as ALLOWED_ORIGINS.
        sync: false
      - key: ALLOWED_HOSTS
        # Include legacylock-backend.onrender.com and any configured API hostname.
        sync: false
      - key: TRUSTED_PROXIES
        # Verified proxy CIDRs only; blank is allowed if none are configured.
        sync: false
      - key: HEARTBEAT_ENABLED
        value: "true"
      - key: RELEASE_HOLD
        value: "true"
      - key: DELIVERY_ENABLED
        value: "false"
      - key: DELIVERY_PAYLOAD_KEY
        sync: false
      - key: DELIVERY_PAYLOAD_KEY_ID
        value: v1
      - key: DELIVERY_PAYLOAD_KEYS
        value: "{}"
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      - key: OPERATIONS_TOKEN
        sync: false
      - key: REGISTRATION_INVITE_CODE
        sync: false
