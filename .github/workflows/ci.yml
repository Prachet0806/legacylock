name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: legacylock
  POSTGRES_PASSWORD: legacylock
  POSTGRES_DB_DEV: legacylock_dev
  POSTGRES_DB_TEST: legacylock_test

jobs:
  backend:
    name: Backend (Ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB_DEV }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ${{ env.POSTGRES_USER }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Create test database
        run: |
          PGPASSWORD=legacylock psql -h localhost -U legacylock -d legacylock_dev -c "CREATE DATABASE legacylock_test;"
        env:
          PGPASSWORD: legacylock

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_dev

      - name: Ruff check
        run: ruff check .
        working-directory: backend

      - name: Ruff format check
        run: ruff format --check .
        working-directory: backend

      - name: mypy type check
        run: mypy .
        working-directory: backend

      - name: pytest
        run: pytest tests/ -v --tb=short
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789
          ENVIRONMENT: test
          ALLOWED_ORIGINS: http://localhost:3000
          HEARTBEAT_CHECK_INTERVAL: "999999"
          HEARTBEAT_ENABLED: "false"

  frontend:
    name: Frontend (ESLint, TypeScript, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npm run typecheck
        working-directory: frontend

      - name: Next.js build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000