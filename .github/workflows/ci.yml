name: CI
on:
  push:
    branches: [main, dev, unstable]
  pull_request:
    branches: [main, dev, unstable]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["0", "1"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: legacylock
          POSTGRES_PASSWORD: legacylock
          POSTGRES_DB: legacylock_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U legacylock" --health-interval=5s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
      DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
      USE_POSTGRES: ${{ matrix.postgres }}
      SESSION_SECRET: ci-isolated-configuration-0000000000000000
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r requirements-dev.txt
      - name: Throwaway test signing keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem
      - run: pytest tests -q --tb=short
      - name: Lint and type nonregression gate
        if: matrix.postgres == '0'
        run: python ../scripts/quality_gate.py
      - name: Backend locked dependency audit
        if: matrix.postgres == '0'
        run: pip-audit -r requirements.lock.txt --no-deps --disable-pip
      - name: Render migration SQL
        run: alembic upgrade head --sql > /tmp/migration.sql
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: /api
      API_UPSTREAM: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: legacylock
          POSTGRES_PASSWORD: legacylock
          POSTGRES_DB: legacylock_e2e
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U legacylock" --health-interval=5s --health-timeout=5s --health-retries=5
    env:
      ENVIRONMENT: test
      USE_POSTGRES: "1"
      MIGRATED_SCHEMA_ONLY: "true"
      DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_e2e
      SESSION_SECRET: ci-isolated-configuration-0000000000000000
      HEARTBEAT_ENABLED: "false"
      REGISTRATION_INVITE_CODE: test-invite-code-123
      E2E_INVITE_CODE: test-invite-code-123
      E2E_OWNER_EMAIL: owner@example.com
      E2E_OWNER_PASSWORD: DevPassword123456
      E2E_PRODUCTION: "1"
      E2E_RESTORE_FIXTURE_PATH: ${{ github.workspace }}/.restore-rehearsal/quorum.json
      ALLOWED_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:3000
      API_UPSTREAM: http://localhost:8000
      # Browser bundle uses /api; direct test API contexts use their :8000 default.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Migrate, seed and start isolated backend
        working-directory: backend
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem
          alembic upgrade head
          python seed_dev_user.py "$E2E_OWNER_EMAIL" "$E2E_OWNER_PASSWORD"
          uvicorn main:app --host 127.0.0.1 --port 8000 --no-proxy-headers > /tmp/api.log 2>&1 &
          echo $! > /tmp/legacylock-api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          mkdir -p ../.restore-rehearsal
          npm run test:e2e -- --reporter=list
        working-directory: frontend
      - name: Encrypted isolated restore and credential quarantine
        working-directory: backend
        env:
          RESTORE_FIXTURE_PASSPHRASE: E2E-Vault-Passphrase-12345
        run: |
          python restore_rehearsal.py --target legacylock_restore_ci --pg-image postgres:17-alpine --report ../docs/restore-rehearsal-evidence.json --fixture-output ../.restore-rehearsal/server.json
          kill "$(cat /tmp/legacylock-api.pid)"
          export DATABASE_URL=postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_restore_ci
          export AUTH_EPOCH=$(python -c 'import json; print(json.load(open("../.restore-rehearsal/server.json"))["auth_epoch"])')
          export RELEASE_HOLD=true DELIVERY_ENABLED=false
          uvicorn main:app --host 127.0.0.1 --port 8000 --no-proxy-headers > /tmp/restored-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
      - name: Fresh browser recovery against restored database
        working-directory: frontend
        run: |
          export DATABASE_URL=postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_restore_ci
          export AUTH_EPOCH=$(python -c 'import json; print(json.load(open("../.restore-rehearsal/server.json"))["auth_epoch"])')
          export RELEASE_HOLD=true DELIVERY_ENABLED=false
          export RESTORE_PYTHON=$(command -v python)
          npx playwright test --config playwright.restore.config.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/test-results/
            docs/restore-rehearsal-evidence.json
          retention-days: 7
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: legacylock-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: legacylock-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            API_UPSTREAM=http://backend:8000
      - name: Standalone assets serve from the image
        run: |
          docker network create qualification
          docker run -d --name postgres --network qualification -e POSTGRES_USER=legacylock -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=legacylock postgres:17-alpine
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U legacylock; then break; fi
            sleep 1
          done
          docker run --rm --network qualification -e ENVIRONMENT=test -e DATABASE_URL=postgresql+psycopg://legacylock:ci-only@postgres:5432/legacylock -e SESSION_SECRET=ci-image-isolated-configuration-0000000000 legacylock-backend:ci alembic upgrade head
          mkdir image-keys
          openssl genrsa -out image-keys/jwt_private.pem 2048
          openssl rsa -in image-keys/jwt_private.pem -pubout -out image-keys/jwt_public.pem
          chmod 644 image-keys/*.pem # throwaway CI keys readable by the container's unprivileged user
          PAYLOAD_KEY=$(openssl rand -base64 32)
          docker run -d --name backend --network qualification --mount type=bind,source="$PWD/image-keys",target=/run/secrets,readonly -e ENVIRONMENT=production -e DATABASE_URL=postgresql+psycopg://legacylock:ci-only@postgres:5432/legacylock -e SESSION_SECRET=ci-image-isolated-configuration-0000000000 -e AUTH_EPOCH=ci-image-isolated -e JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private.pem -e JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public.pem -e DELIVERY_PAYLOAD_KEY="$PAYLOAD_KEY" -e RESEND_API_KEY=ci-never-send -e DELIVERY_ENABLED=false -e RELEASE_HOLD=true -e BACKGROUND_IN_API=false -e ALLOWED_HOSTS=backend,localhost,127.0.0.1 legacylock-backend:ci
          docker run -d --name frontend --network qualification -p 3000:3000 legacylock-frontend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /tmp/index.html; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ > /tmp/index.html
          ASSET=$(python -c 'import re; print(re.search(r"src=\"([^\"]+\.js)\"", open("/tmp/index.html").read()).group(1))')
          curl -fsS "http://localhost:3000$ASSET" > /dev/null
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/readyz
