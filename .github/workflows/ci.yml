name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────
  # Backend — pytest (throwaway SQLite file DB built by Alembic, no
  # Postgres needed). Ruff/mypy report advisory until the backlog clears.
  # ─────────────────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Generate throwaway JWT keys (gitignored, never committed)
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem
        working-directory: backend

      - name: Ruff check (advisory)
        run: ruff check .
        working-directory: backend
        continue-on-error: true

      - name: mypy (advisory)
        run: mypy .
        working-directory: backend
        continue-on-error: true

      - name: pytest
        run: pytest tests/ -v --tb=short
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789
          ENVIRONMENT: test
          ALLOWED_ORIGINS: http://localhost:3000
          HEARTBEAT_CHECK_INTERVAL: "999999"
          HEARTBEAT_ENABLED: "false"

      - name: Alembic offline render (scripts must load + render SQL)
        run: alembic upgrade head --sql > /dev/null
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_dev
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789

  # ─────────────────────────────────────────
  # Frontend — ESLint, TypeScript, production build.
  # ─────────────────────────────────────────
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npm run typecheck
        working-directory: frontend

      - name: Next.js build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ─────────────────────────────────────────
  # Images — both Dockerfiles must build (no push; registry wiring is per
  # platform — see DEPLOY.md). Catches COPY/env/standalone breakage early.
  # ─────────────────────────────────────────
  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: legacylock-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: legacylock-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=

  # ─────────────────────────────────────────
  # E2E — Playwright (starts its own frontend dev server; backend booted
  # below on a file-backed SQLite DB with a seeded owner for the
  # zero-knowledge golden-path spec).
  # ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      E2E_OWNER_EMAIL: owner@example.com
      E2E_OWNER_PASSWORD: E2ETestPassword123456
      E2E_INVITE_CODE: test-invite-code-123
      E2E_DB: /tmp/e2e.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Generate throwaway JWT keys (gitignored, never committed)
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem
        working-directory: backend

      - name: Seed E2E owner + start backend
        run: |
          rm -f "$E2E_DB"
          python seed_dev_user.py "$E2E_OWNER_EMAIL" "$E2E_OWNER_PASSWORD"
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789
          ENVIRONMENT: test
          SQLITE_FILE: /tmp/e2e.db
          ALLOWED_ORIGINS: http://localhost:3000
          FRONTEND_URL: http://localhost:3000
          HEARTBEAT_ENABLED: "false"
          REGISTRATION_INVITE_CODE: test-invite-code-123

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          E2E_INVITE_CODE: test-invite-code-123

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
