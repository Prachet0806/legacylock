name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # NOTE: pytest uses throwaway SQLite (see tests/conftest.py), so no
    # Postgres service and no migrations are needed here. Alembic
    # (backend/alembic/env.py) is exercised via Dockerfile/prod deploys.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Generate throwaway JWT keys (gitignored, never committed)
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem
        working-directory: backend

      # Advisory only: the codebase does not currently pass these gates.
      # They report without failing the build until the backlog is cleared.
      - name: Ruff check (advisory)
        run: ruff check .
        working-directory: backend
        continue-on-error: true

      - name: mypy (advisory)
        run: mypy .
        working-directory: backend
        continue-on-error: true

      - name: pytest
        run: pytest tests/ -v --tb=short
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789
          ENVIRONMENT: test
          ALLOWED_ORIGINS: http://localhost:3000
          HEARTBEAT_CHECK_INTERVAL: "999999"
          HEARTBEAT_ENABLED: "false"

  frontend:
    name: Frontend (ESLint, TypeScript, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npm run typecheck
        working-directory: frontend

      - name: Next.js build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
