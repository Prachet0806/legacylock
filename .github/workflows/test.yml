name: LegacyLock Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Backend — pytest
  # ─────────────────────────────────────────
  backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
        working-directory: backend

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        working-directory: backend
        env:
          LEGACYLOCK_API_KEY: ci-test-key
          DATABASE_URL: sqlite:///:memory:
          HEARTBEAT_CHECK_INTERVAL: "999999"

  # ─────────────────────────────────────────
  # Frontend — TypeScript + Playwright
  # ─────────────────────────────────────────
  frontend:
    name: Frontend Tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend  # run backend first; shares same runner env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start backend (background)
        run: |
          pip install -r requirements.txt
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3   # give uvicorn time to start
        working-directory: backend
        env:
          LEGACYLOCK_API_KEY: ci-test-key

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_API_KEY: ci-test-key

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
