name: LegacyLock Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Backend — pytest
  # ─────────────────────────────────────────
  backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: legacylock
          POSTGRES_PASSWORD: legacylock
          POSTGRES_DB: legacylock_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legacylock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Create test database
        run: |
          PGPASSWORD=legacylock psql -h localhost -U legacylock -d legacylock_dev -c "CREATE DATABASE legacylock_test;"
        env:
          PGPASSWORD: legacylock

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_dev

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789
          ENVIRONMENT: test
          ALLOWED_ORIGINS: http://localhost:3000
          HEARTBEAT_CHECK_INTERVAL: "999999"
          HEARTBEAT_ENABLED: "false"

  # ─────────────────────────────────────────
  # Frontend — TypeScript + Playwright
  # ─────────────────────────────────────────
  frontend:
    name: Frontend Tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend  # run backend first; shares same runner env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start backend (background)
        run: |
          pip install -r requirements.txt
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3   # give uvicorn time to start
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_dev
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789
          ENVIRONMENT: test
          ALLOWED_ORIGINS: http://localhost:3000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
