name: LegacyLock Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Backend — pytest (throwaway SQLite, no Postgres needed)
  # ─────────────────────────────────────────
  backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Generate throwaway JWT keys (gitignored, never committed)
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem
        working-directory: backend

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789
          ENVIRONMENT: test
          ALLOWED_ORIGINS: http://localhost:3000
          HEARTBEAT_CHECK_INTERVAL: "999999"
          HEARTBEAT_ENABLED: "false"

  # ─────────────────────────────────────────
  # Frontend — TypeScript + Playwright.
  # Playwright starts the frontend dev server itself (see
  # playwright.config.ts webServer). The backend is booted below on a
  # file-backed SQLite DB with a seeded owner so the golden-path E2E
  # (tests/golden.spec.ts) runs the full owner→trigger→recovery flow.
  # Page/redirect specs pass with the API unreachable by design.
  # ─────────────────────────────────────────
  frontend:
    name: Frontend Tests (Playwright)
    runs-on: ubuntu-latest
    env:
      E2E_OWNER_EMAIL: owner@example.com
      E2E_OWNER_PASSWORD: E2ETestPassword123456
      E2E_DB: /tmp/e2e.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Generate throwaway JWT keys (gitignored, never committed)
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem
        working-directory: backend

      - name: Seed E2E owner + start backend
        run: |
          rm -f "$E2E_DB"
          python seed_dev_user.py "$E2E_OWNER_EMAIL" "$E2E_OWNER_PASSWORD"
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://legacylock:legacylock@localhost:5432/legacylock_test
          SESSION_SECRET: test-secret-key-for-testing-only-32b-0123456789
          ENVIRONMENT: test
          SQLITE_FILE: /tmp/e2e.db
          ALLOWED_ORIGINS: http://localhost:3000
          FRONTEND_URL: http://localhost:3000
          HEARTBEAT_ENABLED: "false"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
