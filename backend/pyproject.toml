[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "PTH", "SIM", "T20", "TRY"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "TRY003"]
per-file-ignores = { "tests/*" = ["S101", "S106", "S107"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true