[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "PTH", "SIM", "T20", "TRY", "S", "B", "A"]
ignore = ["ARG001", "ARG002", "TRY003", "S101"]
per-file-ignores = { "tests/*" = ["S101", "S106", "S107"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true